<!DOCTYPE html>
<html>
<head>
    <title>Test Favorite Button</title>
    <style>
        body {
            background: #1e1e1e;
            color: #e0e0e0;
            font-family: monospace;
            padding: 20px;
        }
        .session-item {
            margin: 10px;
            padding: 8px 40px 8px 10px;
            cursor: pointer;
            border-radius: 5px;
            background: #2a2a2a;
            position: relative;
            width: 400px;
        }
        .session-item:hover {
            background: #3a3a3a;
        }
        .session-preview {
            font-size: 13px;
            margin-bottom: 4px;
        }
        .session-meta {
            font-size: 11px;
            color: #888;
        }
        .favorite-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 18px;
            opacity: 0.3;
            transition: opacity 0.2s, transform 0.1s;
            z-index: 10;
            user-select: none;
        }
        .session-item:hover .favorite-btn {
            opacity: 0.8;
        }
        .favorite-btn:hover {
            opacity: 1 !important;
            transform: translateY(-50%) scale(1.3);
        }
        .favorite-btn:active {
            transform: translateY(-50%) scale(0.9);
        }
    </style>
</head>
<body>
    <h2>Test Favorite Button Display</h2>
    <p>Hover over the sessions to see the star button appear on the right side:</p>

    <div class="session-item">
        <div class="session-preview">Session 1: Not Favorited</div>
        <div class="session-meta">
            <span>2 hours ago</span>
            <span>10 messages</span>
        </div>
        <div class="favorite-btn" title="Add to favorites">☆</div>
    </div>

    <div class="session-item">
        <div class="session-preview">Session 2: Favorited!</div>
        <div class="session-meta">
            <span>5 hours ago</span>
            <span>25 messages</span>
        </div>
        <div class="favorite-btn" title="Remove from favorites">⭐</div>
    </div>

    <div class="session-item">
        <div class="session-preview">Session 3: Not Favorited</div>
        <div class="session-meta">
            <span>1 day ago</span>
            <span>5 messages</span>
        </div>
        <div class="favorite-btn" title="Add to favorites">☆</div>
    </div>

    <script>
        document.querySelectorAll('.favorite-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (btn.innerHTML === '☆') {
                    btn.innerHTML = '⭐';
                    btn.title = 'Remove from favorites';
                    alert('Added to favorites!');
                } else {
                    btn.innerHTML = '☆';
                    btn.title = 'Add to favorites';
                    alert('Removed from favorites!');
                }
            });
        });

        document.querySelectorAll('.session-item').forEach(item => {
            item.addEventListener('click', (e) => {
                if (!e.target.classList.contains('favorite-btn')) {
                    alert('Session clicked!');
                }
            });
        });
    </script>
</body>
</html>
