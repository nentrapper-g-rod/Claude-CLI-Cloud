<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#1a1a1a"/>
  <g transform="translate(256,256)">
    <!-- Robot head -->
    <rect x="-80" y="-100" width="160" height="140" rx="20" fill="#4a9eff" stroke="#fff" stroke-width="8"/>
    <!-- Antenna -->
    <rect x="-8" y="-140" width="16" height="40" fill="#4a9eff"/>
    <circle cx="0" cy="-140" r="12" fill="#ff6b6b"/>
    <!-- Eyes -->
    <circle cx="-35" cy="-60" r="20" fill="#fff"/>
    <circle cx="35" cy="-60" r="20" fill="#fff"/>
    <circle cx="-35" cy="-60" r="10" fill="#1a1a1a"/>
    <circle cx="35" cy="-60" r="10" fill="#1a1a1a"/>
    <!-- Mouth -->
    <rect x="-40" y="0" width="80" height="8" rx="4" fill="#fff"/>
    <!-- Body -->
    <rect x="-60" y="50" width="120" height="100" rx="15" fill="#4a9eff" stroke="#fff" stroke-width="8"/>
    <!-- Arms -->
    <rect x="-100" y="60" width="30" height="60" rx="15" fill="#4a9eff" stroke="#fff" stroke-width="6"/>
    <rect x="70" y="60" width="30" height="60" rx="15" fill="#4a9eff" stroke="#fff" stroke-width="6"/>
  </g>
</svg>
